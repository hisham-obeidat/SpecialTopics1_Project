capacity:
  k_per_day: 40

targets:                   
  critical_capture_at_k:
    overall: 0.70
    min_per_assigner_group: 0.60
  hc_capture_at_k:
    overall: 0.35
  beat_v0_by: 0.10         

data:
  history: data/cves_history.csv
  day_sample: data/day_sample.csv

split:
  test_months: 2
  validation_months: 2

model:
  name: cve-triage        
  type: logistic_regression
  params:
    C: 0.3
    max_iter: 2000
    class_weight: balanced
  tfidf:
    max_features: 50000
    ngram_range: [1, 2]
    min_df: 3
  random_state: 42

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: cve-triage

paths:
  artifacts: artifacts      
  reports: reports