[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cve_triage"
version = "0.1.0"
description = "CVE Triage Assistant: ranks each day's CVEs so the most severe come first"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "pyyaml==6.0.2",
    "joblib==1.4.2",
    "mlflow==2.17.2",
    "sqlalchemy==2.0.36",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "build==1.2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]